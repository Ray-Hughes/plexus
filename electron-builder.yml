appId: dev.rayhughes.plexus
productName: Plexus
copyright: Copyright © 2026 Ray Hughes

directories:
  buildResources: assets
  output: release

afterPack: scripts/after-pack.cjs

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'

# The MCP server ships alongside the app so a project can be wired to a bundled
# path — see src/main/provision.ts.
extraResources:
  - from: dist/cli
    to: cli
    filter: ['**/*.mjs']

asarUnpack:
  - '**/node_modules/node-pty/**'

# node-pty ships N-API prebuilds that work under both Node and Electron, so
# there is nothing to rebuild — and letting electron-builder rebuild it
# replaces the host binary with one for whatever arch was last packaged.
npmRebuild: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: assets/icon.png
  darkModeSupport: true
  # Ad-hoc sign ("-") when there is no Developer ID. Without this,
  # electron-builder leaves Electron's own inherited signature on a bundle it
  # has modified, which is *invalid* rather than merely untrusted — and macOS
  # reports an arm64 app with a broken signature as "damaged", refuses to open
  # it, and deletes it. Ad-hoc is still untrusted, but it is valid, so the user
  # gets the normal "unidentified developer" path instead.
  # Replace with a real "Developer ID Application" identity to ship properly.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: assets/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  category: Development
  icon: assets/icon.png

publish:
  provider: github
  owner: Ray-Hughes
  repo: plexus
